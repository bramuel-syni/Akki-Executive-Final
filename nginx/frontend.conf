# AKKI frontend nginx — TLS terminates here using the Cloudflare Origin
# Certificate (mode "Full (strict)"). Cloudflare proxies the public TLS;
# this server presents the origin cert to Cloudflare only.
#
# Layout:
#   * 80  → 301 redirect to 443
#   * 443 → TLS, /healthz (cheap), /api/* → backend, /static/* (immutable
#           hashed assets), /index.html (no-store), SPA fallback to /
#
# Tuning rationale (read before editing):
#   * proxy_buffering off    — required for SSE token streaming when
#                              Phase B.3 lands. Leave OFF.
#   * proxy_read_timeout 300s — briefings + LLM calls can run long; the
#                              recent option-b fallback adds a Gemini
#                              retry on Claude 502. Don't drop below 240.
#   * client_max_body_size   — board pack DOCX uploads. Keep at 50m
#                              unless the upload size limit is raised
#                              in backend ACCEPT/MAX_BYTES.
#   * Cache-Control          — index.html no-store so the browser never
#                              serves a stale shell after deploy; the
#                              hashed /static assets are 1y immutable.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Cheap healthcheck on 80 too — Docker HEALTHCHECK uses this.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Everything else → 301 to https.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/akki/origin.crt;
    ssl_certificate_key /etc/akki/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Upload headroom — DOCX board packs and PPTX exports.
    client_max_body_size 50m;
    client_body_timeout  120s;

    root  /usr/share/nginx/html;
    index index.html;

    # Healthcheck (also reachable on :80 above).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # API → backend uvicorn. Compose service name resolves on the
    # internal docker network.
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_pass http://backend:8001/api/;
    }

    # CRA hashed assets — content-addressable, safe to cache forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # SPA shell — must NEVER be cached. Otherwise a deploy ships new
    # /static/main.<hash>.js but browsers keep the old index.html that
    # references the OLD hashes → broken UX.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Client routes (react-router 7) → fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block hidden files except .well-known (ACME challenges, etc.).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
