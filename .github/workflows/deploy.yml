# AKKI production deploy — GitHub Actions.
#
# Trigger:
#   * push to `main`            — full build + deploy
#   * workflow_dispatch         — manual deploy of an arbitrary SHA
#                                 (rollback button: re-run the workflow
#                                 against an earlier commit ref)
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   AZURE_VM_HOST            FQDN or IP of the production VM
#   AZURE_VM_USER            sudo-capable login (e.g. azureuser)
#   AZURE_VM_SSH_KEY         private key (PEM) authorised on the VM
#   ACR_NAME                 e.g. akkiprod        (no .azurecr.io suffix)
#   ACR_LOGIN_SERVER         e.g. akkiprod.azurecr.io
#   ACR_USERNAME             ACR push-token user
#   ACR_PASSWORD             ACR push-token password
#   REACT_APP_BACKEND_URL    e.g. https://akki.syni.ai

name: prod-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or tag to deploy"
        required: false
        default: ""

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:

  build:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Compute image tag (git short SHA — immutable)
        id: tag
        run: |
          short=$(git rev-parse --short=7 HEAD)
          echo "image_tag=$short" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$short" >> "$GITHUB_ENV"
          echo "::notice title=Image tag::$short"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/akki-backend:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/akki-backend:latest-prod
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/akki-backend:buildcache
          cache-to:   type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/akki-backend:buildcache,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/akki-frontend:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/akki-frontend:latest-prod
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/akki-frontend:buildcache
          cache-to:   type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/akki-frontend:buildcache,mode=max

  # Wave8.followup.3 (2026-02 fork-resume) — pre-deploy orthogonality gate.
  # Runs `make deploy-check` (= `pytest -m runtime_playwright`) against the
  # configured preview before promoting to prod. Blocks deploy on any
  # orthogonality regression — Phase Z-slice-6 caught all 6 historic
  # Phase Z bugs at once when introduced; promoting it to a deploy
  # blocker prevents the cohort from ever hitting the same class of
  # regression in production.
  deploy-check:
    name: Pre-deploy orthogonality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test deps + Playwright
        run: |
          cd backend && pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Write frontend/.env for preview URL
        run: |
          mkdir -p frontend
          echo "REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL }}" > frontend/.env

      - name: Run orthogonality wire-tests
        run: make deploy-check

  deploy:
    name: Deploy to VM
    needs: [build, deploy-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Pull-and-up over SSH (with auto-rollback)
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key:      ${{ secrets.AZURE_VM_SSH_KEY }}
          # Run the deploy helper. It pulls, swaps, polls /api/health,
          # records last-good-tag on success, redeploys previous tag on
          # failure, exits non-zero on either failure path.
          script: |
            set -euo pipefail
            sudo /usr/local/bin/akki-deploy.sh "${{ env.IMAGE_TAG }}"

  notify:
    name: Summary
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write Action Summary
        run: |
          echo "## AKKI prod deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| field | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ref | ${{ github.event.inputs.ref || github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| image_tag | ${{ needs.build.outputs.image_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| build | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| deploy | ${{ needs.deploy.result }} |" >> "$GITHUB_STEP_SUMMARY"
