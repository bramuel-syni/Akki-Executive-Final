[pytest]
# Pytest configuration for the AKKI backend.
#
# Phase 15.0 hardening pass introduces pytest-asyncio in "auto" mode so
# `async def test_*` functions are auto-collected without per-function
# markers. Existing tests that use sync wrappers + `asyncio.run()` are
# untouched: pytest-asyncio "auto" mode only intercepts async-def tests.
#
# As of the 15.0 hardening pass, only test_solva_v2_integration.py uses
# async-def tests; every other test in this suite remains sync.

asyncio_mode = auto

# Phase 15.1: bumped pytest-asyncio to >=0.25 so this directive is honoured.
# Without it, the session-scoped event_loop fixture override is deprecated
# in 0.23 and breaks under 0.25; with it, async tests share one loop for
# the whole session, which is what Motor's module-singleton client needs.
#
# Both scopes must be `session`:
#   - fixture scope binds the event_loop fixture itself
#   - test scope binds individual async test functions
# pytest-asyncio 0.25+ default test scope is `function`, which gives every
# async test its own loop. Motor's module-singleton client (in core.py) is
# bound to the loop active at first await; rebinding per-test produces
# `RuntimeError: Event loop is closed` on every test after the first.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Default to short tracebacks for readability; CI overrides with -vv when needed.
addopts = -ra

# Custom markers — registered to avoid PytestUnknownMarkWarning.
markers =
    runtime_playwright: live-browser DOM assertions via Playwright (slow; skip with -m "not runtime_playwright")
    integrity_seed: admin@akki.ai Solva v2 seed-cohort integrity reproducer (issue 2; reads live DB; skip with -m "not integrity_seed")
